/* Layout: app de trabajo — barra superior, lista de bodas y ficha de cada boda con pestañas */
:root{
  --bg:#F1F3EF; --surface:#FFFFFF; --surface-2:#F6F8F4; --ink:#1E2A24; --muted:#5D6A62; --line:#D7DED5;
  --accent:#2E5B4A; --accent-ink:#FFFFFF; --accent-soft:#DDE9E2; --gold:#A9843F; --gold-soft:#F3EAD7;
  --ok:#2F7A4F; --warn:#B26A1E; --bad:#A13A3A;
  --font-display:'Marcellus','Cormorant Garamond',Georgia,serif;
  --font-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;

}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111714; --surface:#18201C; --surface-2:#1E2823; --ink:#E6ECE8; --muted:#9BA9A0; --line:#2E3B34;
  --accent:#8CC4AA; --accent-ink:#0E1A14; --accent-soft:#233429; --gold:#D4B477; --gold-soft:#3A3122;
  --ok:#7CC79A; --warn:#E3A35A; --bad:#E58989; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#111714; --surface:#18201C; --surface-2:#1E2823; --ink:#E6ECE8; --muted:#9BA9A0; --line:#2E3B34;
  --accent:#8CC4AA; --accent-ink:#0E1A14; --accent-soft:#233429; --gold:#D4B477; --gold-soft:#3A3122;
  --ok:#7CC79A; --warn:#E3A35A; --bad:#E58989; color-scheme:dark }
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;align-items:center;gap:10px;padding-block:10px;padding-inline:16px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.05;cursor:pointer}
.brand b{font-family:var(--font-display);font-weight:400;font-size:22px;color:var(--accent);letter-spacing:.02em}
.brand span{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:600}
.top .sp{flex:1}
.who{font-size:12.5px;color:var(--muted);max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:13px}
.seg{display:inline-flex;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button{border:0;background:none;border-radius:7px;padding:4px 10px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.wrap{max-width:1120px;margin:0 auto;padding-block:20px 60px;padding-inline:16px}
h1,h2,h3{font-family:var(--font-display);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:30px}h2{font-size:22px}h3{font-size:18px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin:0 0 6px}
.muted{color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.grid{display:grid;gap:14px}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px}
.wlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}

.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}

.pill.warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.pill.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}

.whead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 20px;margin-bottom:14px}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto;scrollbar-width:none}

.field{display:grid;gap:5px;margin-bottom:12px;min-width:0}
.field>label{font-size:12px;font-weight:600;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.f2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:0 12px}

input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}

.sunrow .tm{font-family:var(--font-mono);min-width:106px}
.ro .blk{grid-template-columns:118px minmax(0,1fr)}

.ml{display:block;min-width:0}.ml span{display:none}.ml input,.ml select{width:100%}
.tg .tgl{display:none}
.money{font-family:var(--font-mono);font-variant-numeric:tabular-nums;text-align:right}
.bdet{border-top:1px dashed var(--line);padding:10px;display:grid;gap:8px}
.bhead{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.3fr) 110px 110px 110px 34px;gap:8px;padding:0 10px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.pays{display:grid;gap:4px}
.pay{display:grid;grid-template-columns:140px 130px minmax(0,1fr) 30px;gap:6px;align-items:center}
.ro .bsum{grid-template-columns:minmax(0,2fr) minmax(0,1.3fr) 120px 120px}

  .bhead{display:none}

  .tg{grid-column:1/-1;justify-content:center}.tg .tgl{display:inline}.tg .tgs{display:none}

  .pay{grid-template-columns:1fr 1fr}
  .blk,.ro .blk{grid-template-columns:1fr}

/* documentos */
.docs{display:grid;gap:8px}
.doc{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.doc .ic{width:40px;height:40px;border-radius:10px;background:var(--gold-soft);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--gold);text-transform:uppercase}
.doc .nm{font-weight:600;overflow-wrap:anywhere}
.drop{border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted);background:var(--surface-2)}
.drop.on{border-color:var(--accent);background:var(--accent-soft)}
/* login */
.login{max-width:420px;margin:8vh auto;padding-inline:16px}
.login .card{padding:24px}
.login h1{font-size:34px;color:var(--accent)}
.status{font-size:12px;color:var(--muted);min-width:70px;text-align:right}
.qsec{margin-top:22px}.qsec>summary{cursor:pointer;list-style:none}.qsec>summary::-webkit-details-marker{display:none}
.qcat{font-size:15px;color:var(--muted);margin:14px 0 6px}
.qlist{display:grid;gap:8px}
.qcard{display:flex;gap:12px;justify-content:space-between;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.qright{display:flex;align-items:center;gap:10px;flex:none}
.cmp{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:10px}
.cmpc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.sheet.wide{width:min(1180px,100%);height:min(92vh,100%)}
.rv{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;height:calc(100% - 60px);min-height:0}
.rvp{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;overflow:auto;min-height:300px;display:flex;flex-direction:column}
.rvf{overflow:auto;padding-right:4px;min-width:0}
.qitems{display:grid;gap:6px}
.qit{display:grid;grid-template-columns:minmax(0,2.4fr) 64px 92px 104px 30px;gap:6px;align-items:center;border-radius:8px}
.qit input{padding:5px 7px}
.doubt input,.doubt select,.qit.doubt{background:color-mix(in srgb,var(--warn) 16%,var(--surface-2))!important;border-color:var(--warn)!important}
.field.doubt>label::after{content:' · confirmar';color:var(--warn)}
.appr{border-top:1px solid var(--line);margin-top:8px;padding-top:12px;position:sticky;bottom:0;background:var(--surface)}
@media (max-width:860px){.rv{grid-template-columns:1fr;height:auto}.rvp{max-height:45vh}.sheet.wide{height:auto}.qit{grid-template-columns:1fr 1fr}.qit input[data-if="concept"]{grid-column:1/-1}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;z-index:50;max-width:calc(100% - 32px)}
.modal{position:fixed;inset:0;background:rgba(10,15,12,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:40}
.sheet{background:var(--surface);border-radius:14px;padding:20px;width:min(520px,100%);max-height:100%;overflow:auto}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty h2{color:var(--ink);margin-bottom:6px}
.demo{background:var(--gold-soft);color:var(--ink);font-size:12px;padding-block:6px;padding-inline:16px;text-align:center}
.cdown{display:flex;align-items:baseline;gap:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600}
.upc{display:grid;gap:6px}
.upc div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px;font-size:13px}
.upc .money{white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function sunTimes(ds,lat,lng){if(!ds||lat==null||lng==null)return null;const r=Math.PI/180,[y,m,d]=ds.split('-').map(Number);const Jd=Date.UTC(y,m-1,d,12)/864e5+2440587.5;

function minsIn(date,tz){const p=new Intl.DateTimeFormat('en-GB',{timeZone:tz||'America/Mazatlan',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(date);return +p.find(x=>x.type==='hour').value*60+ +p.find(x=>x.type==='minute').value}
function hm(min){if(min==null||isNaN(min))return '—';min=((Math.round(min)%1440)+1440)%1440;let h=Math.floor(min/60),m=min%60;const ap=h>=12?'p.m.':'a.m.';h=h%12||12;return `${h}:${String(m).padStart(2,'0')} ${ap}`}
const toMin=s=>{if(!s)return null;const [h,m]=s.split(':').map(Number);return h*60+m};
function sunsetMin(w){const L=w.loc||{};const s=sunTimes(w.date,L.lat,L.lng);return s?minsIn(s.set,L.tz):null}
function schedule(w){const it=w.itinerary||{},bl=it.blocks||[],lead=it.lead??90,round=it.round!==false;const ss=sunsetMin(w);const out=bl.map(()=>({s:0,e:0}));
  let a=bl.findIndex(b=>b.anchor);let aStart;
  if(a<0){a=0;aStart=toMin(bl[0]?.fixed)??960}else aStart=bl[a].fixed?toMin(bl[a].fixed):ss!=null?ss-lead:toMin('17:00');
  if(round&&!(bl[a]&&bl[a].fixed))aStart=Math.floor(aStart/5)*5;
  if(!bl.length)return {out,ss};
  out[a]={s:aStart,e:aStart+(+bl[a].dur||0)};
  let next=aStart;for(let i=a-1;i>=0;i--){const s=bl[i].fixed?toMin(bl[i].fixed):next-(+bl[i].dur||0);out[i]={s,e:s+(+bl[i].dur||0)};next=s}
  let prev=out[a].e;for(let i=a+1;i<bl.length;i++){const s=bl[i].fixed?toMin(bl[i].fixed):prev;out[i]={s,e:s+(+bl[i].dur||0)};prev=out[i].e}
  return {out,ss}}

/* ---------- Formato ---------- */
const money=(n,cur)=>new Intl.NumberFormat('es-MX',{style:'currency',currency:cur||'MXN',maximumFractionDigits:0}).format(+n||0);
function fdate(ds,opt){if(!ds)return 'Sin fecha';const [y,m,d]=ds.split('-').map(Number);return new Date(Date.UTC(y,m-1,d,12)).toLocaleDateString('es-MX',Object.assign({timeZone:'UTC',weekday:'long',day:'numeric',month:'long',year:'numeric'},opt||{}))}
function daysTo(ds){if(!ds)return null;const [y,m,d]=ds.split('-').map(Number);const t=new Date();const a=Date.UTC(t.getFullYear(),t.getMonth(),t.getDate()),b=Date.UTC(y,m-1,d);return Math.round((b-a)/864e5)}
function daysLbl(n){if(n==null)return '';if(n===0)return 'Es hoy';if(n<0)return `Hace ${-n} días`;return n===1?'Falta 1 día':`Faltan ${n} días`}

/* ---------- Presupuesto ---------- */
function itemAmount(i){if(i.status==='descartado')return 0;if(+i.quote>0)return +i.quote;return +i.est||0}
function itemPaid(i){return (i.payments||[]).reduce((a,p)=>a+(+p.amount||0),0)}
function totals(w,coupleOnly){const items=(w.budget?.items||[]).filter(i=>!coupleOnly||i.visible!==false);let est=0,proj=0,comm=0,paid=0;
  for(const i of items){if(i.status==='descartado')continue;est+=+i.est||0;proj+=itemAmount(i);if(i.status==='contratado')comm+=itemAmount(i);paid+=itemPaid(i)}
  return {est,proj,comm,paid,due:Math.max(0,comm-paid),target:+w.budget?.target||0}}

function renderWedding(){const w=V.w,d=daysTo(w.date),tabs=isPlanner()?TABS_P:TABS_C;if(!tabs.some(t=>t[0]===V.tab))V.tab='resumen';
  $('#app').innerHTML=topBar()+`<main class="wrap"><div class="whead"><div style="flex:1 1 280px;min-width:0">${isPlanner()?'<button class="btn ghost sm" id="back" style="padding-left:0">← Todas las bodas</button>':''}<p class="eyebrow">${esc(fdate(w.date))}</p><h1>${esc(w.couple||'Boda sin nombre')}</h1></div>
  <div class="row">${d!=null?`<span class="pill ${d<=30&&d>=0?'warn':'gold'}">${daysLbl(d)}</span>`:''}<span class="pill">${esc(w.place||w.loc?.name||'Lugar por definir')}</span></div></div>
  <nav class="tabs" role="tablist">${tabs.map(([k,n])=>`<button role="tab" data-tab="${k}" aria-selected="${V.tab===k}">${n}</button>`).join('')}</nav><section id="tab"></section></main>`;
  bindTop();const b=$('#back');if(b)b.onclick=async()=>{await saveNow();Store.unsub();V.view='home';V.w=null;renderHome()};
  document.querySelectorAll('[data-tab]').forEach(x=>x.onclick=()=>{V.tab=x.dataset.tab;document.querySelectorAll('[data-tab]').forEach(y=>y.setAttribute('aria-selected',y.dataset.tab===V.tab));renderTab()});
  if(isPlanner())setStatus(V.pending?'Sin guardar':'Guardado');renderTab()}
function renderTab(){const el=$('#tab');if(!el)return;({resumen:tabResumen,itinerario:tabItin,presupuesto:tabBudget,cotizaciones:tabQuotes,docs:tabDocs,datos:tabDatos})[V.tab](el)}

/* Resumen */
function tabResumen(el){const w=V.w,cpl=!isPlanner(),t=totals(w,cpl),ss=sunsetMin(w),sc=schedule(w),cer=(w.itinerary.blocks||[]).findIndex(b=>b.anchor),d=daysTo(w.date);
  const ups=(w.budget.items||[]).filter(i=>(!cpl||i.visible!==false)&&i.status==='contratado'&&itemAmount(i)-itemPaid(i)>0).map(i=>({i,due:i.due||'9999-12-31',bal:itemAmount(i)-itemPaid(i)})).sort((a,b)=>a.due.localeCompare(b.due)).slice(0,6);
  const key=(w.itinerary.blocks||[]).map((b,k)=>({b,k})).filter(x=>(!cpl||x.b.couple)&&/ceremonia|cóctel|coctel|cena|primer baile|fiesta|salida|llegada de invitados/i.test(x.b.t)).slice(0,7);
  el.innerHTML=`<div class="cols2"><div class="card"><p class="eyebrow">Cuenta regresiva</p><div class="cdown"><span class="big">${d!=null&&d>=0?d:'—'}</span><span class="muted">${d==null?'Falta la fecha':d>=0?'días para la boda':'Boda realizada'}</span></div>
    <dl class="kv" style="margin-top:14px"><dt>Fecha</dt><dd>${esc(fdate(w.date))}</dd><dt>Lugar</dt><dd>${esc(w.place||'Por definir')}</dd><dt>Destino</dt><dd>${esc(w.loc?.name||'—')}</dd><dt>Invitados</dt><dd>${w.guests||'—'}</dd>
    <dt>Atardecer</dt><dd>${ss!=null?hm(ss):'Agrega fecha y destino'}</dd><dt>Ceremonia</dt><dd>${cer>=0&&ss!=null?hm(sc.out[cer].s):'—'}</dd></dl></div>
   <div class="card"><p class="eyebrow">Momentos clave</p>${key.length?`<div class="upc">${key.map(x=>`<div><span>${esc(x.b.t)}</span><span class="money">${hm(sc.out[x.k].s)}</span></div>`).join('')}</div>`:'<p class="note">Arma el itinerario para verlo aquí.</p>'}</div>
   <div class="card"><p class="eyebrow">Presupuesto</p><div class="stats"><div class="stat"><b>${money(t.target||t.est,w.currency)}</b><span>${t.target?'Presupuesto objetivo':'Estimado'}</span></div><div class="stat"><b>${money(t.comm,w.currency)}</b><span>Contratado</span></div><div class="stat"><b>${money(t.paid,w.currency)}</b><span>Pagado</span></div><div class="stat"><b>${money(t.due,w.currency)}</b><span>Por pagar</span></div></div>
    ${t.target?`<div style="margin-top:12px"><div class="bar"><i style="width:${Math.min(100,t.proj/t.target*100)}%;${t.proj>t.target?'background:var(--bad)':''}"></i></div><p class="note">${t.proj>t.target?`<span class="pill bad">Proyectado ${money(t.proj-t.target,w.currency)} arriba del objetivo</span>`:`Proyectado: ${money(t.proj,w.currency)} (${Math.round(t.proj/t.target*100)}% del objetivo)`}</p></div>`:''}</div>
   <div class="card"><p class="eyebrow">Próximos pagos</p>${ups.length?`<div class="upc">${ups.map(u=>`<div><span>${esc(u.i.concept||u.i.cat)}${u.i.vendor?` · <span class="muted">${esc(u.i.vendor)}</span>`:''}<br><small class="muted">${u.due==='9999-12-31'?'Sin fecha límite':'Antes del '+esc(fdate(u.due,{weekday:undefined,year:undefined}))}</small></span><span class="money">${money(u.bal,w.currency)}</span></div>`).join('')}</div>`:'<p class="note">No hay pagos pendientes de servicios contratados.</p>'}</div>
   ${isPlanner()?`<div class="card" style="grid-column:1/-1"><p class="eyebrow">Notas internas</p><p class="note" style="margin:0 0 8px">Solo tú las ves. La pareja no tiene acceso.</p><textarea id="pNotes" placeholder="Acuerdos, gustos de la pareja, pendientes…">${esc(V.priv.notes||'')}</textarea></div>`:''}
   ${!isPlanner()&&V.docs.length?`<div class="card"><p class="eyebrow">Documentos recientes</p><div class="upc">${V.docs.slice(0,4).map(x=>`<div><span>${esc(x.name)}</span><span class="muted">${esc((DOCK.find(k=>k[0]===x.kind)||DOCK[4])[1])}</span></div>`).join('')}</div></div>`:''}</div>`;
  const pn=$('#pNotes');if(pn){let tt;pn.oninput=()=>{V.priv.notes=pn.value;clearTimeout(tt);tt=setTimeout(()=>Store.savePrivate(V.id,V.priv).catch(e=>toast(e.message)),700)}}}

/* Itinerario */
function tabItin(el){const w=V.w,it=w.itinerary,pl=isPlanner(),{out,ss}=schedule(w),bl=it.blocks;
  const vis=bl.map((b,i)=>({b,i,t:out[i]})).filter(x=>pl||x.b.couple);
  let rows='',sunDone=ss==null;
  for(const x of vis){if(!sunDone&&x.t.s>=ss){rows+=sunRow(ss);sunDone=true}rows+=pl?blkEdit(x,w):blkRO(x)}
  if(!sunDone)rows+=sunRow(ss);
  const L=w.loc||{};
  el.innerHTML=`<div class="card" style="margin-bottom:14px"><div class="row" style="justify-content:space-between;gap:14px">
     <div><p class="eyebrow">Atardecer ${esc(L.name?'en '+L.name:'')}</p><div class="row"><span class="big" style="font-size:30px">${ss!=null?hm(ss):'—'}</span><span class="muted">${w.date?esc(fdate(w.date,{weekday:undefined})):'Agrega la fecha'}</span></div>
     ${ss!=null?`<p class="note">Hora dorada para fotos: ${hm(ss-60)} a ${hm(ss)}. Cálculo astronómico, ± 3 min.</p>`:'<p class="note">Agrega fecha y destino en "Datos y acceso" para calcular el atardecer.</p>'}</div>
     ${pl?`<div style="max-width:420px"><div class="row"><label for="lead" class="muted" style="font-size:13px">La ceremonia empieza</label><input type="number" id="lead" min="0" max="600" step="5" value="${it.lead??90}" style="width:80px"><span class="muted" style="font-size:13px">min antes del atardecer</span></div>
       <label class="row" style="margin-top:6px;font-size:13px"><input type="checkbox" id="rnd" ${it.round!==false?'checked':''}> Redondear a 5 minutos</label></div>`:''}</div></div>
   ${pl?`<div class="row" style="margin-bottom:10px;justify-content:space-between"><div class="row"><button class="btn sm primary" id="addB">+ Agregar momento</button><button class="btn sm" id="pst">Pegar itinerario</button><button class="btn sm" id="cpy">Copiar para WhatsApp</button></div><div class="row"><button class="btn sm" id="tplS">Guardar como mi plantilla</button><button class="btn sm" id="tplL">Usar mi plantilla</button></div></div>
     <p class="note" style="margin:-4px 0 10px">El momento marcado como <b>ancla</b> se calcula desde el atardecer. Los de antes se acomodan hacia atrás y los de después, hacia adelante. Si un momento tiene hora fija, los siguientes empiezan desde ahí.</p>`:`<div class="row" style="margin-bottom:10px"><button class="btn sm" id="cpy">Copiar itinerario</button></div>`}
   <div class="itin ${pl?'':'ro'}">${rows||'<p class="note">Aún no hay momentos en el itinerario.</p>'}</div>`;
  if(pl){$('#pst').onclick=pasteItin;const ld=$('#lead');ld.oninput=()=>{it.lead=+ld.value||0;markDirty()};ld.onchange=()=>tabItin(el);$('#rnd').onchange=e=>{it.round=e.target.checked;markDirty();tabItin(el)};
    $('#addB').onclick=()=>{bl.push({id:uid(),t:'Nuevo momento',dur:30,anchor:false,fixed:'',couple:true,note:''});markDirty();tabItin(el);const ins=el.querySelectorAll('.blk .ti input');ins[ins.length-1]?.select()};
    $('#tplS').onclick=async()=>{Store.settings.template=bl.map(b=>({t:b.t,dur:b.dur,anchor:b.anchor,couple:b.couple,note:b.note}));try{await Store.saveSettings(Store.settings);toast('Plantilla guardada. Las bodas nuevas empezarán así.')}catch(e){toast(e.message)}};
    $('#tplL').onclick=()=>{const tpl=(Store.settings.template||[]).length?Store.settings.template:DEFAULT_ITIN;confirmIn('#tplL','¿Reemplazar el itinerario con tu plantilla?',()=>{it.blocks=itinFrom(tpl);markDirty();tabItin(el)})};
    el.querySelectorAll('[data-b]').forEach(row=>{const b=bl.find(x=>x.id===row.dataset.b);
      row.querySelectorAll('[data-f]').forEach(inp=>{const f=inp.dataset.f;const ev=inp.type==='checkbox'||inp.tagName==='SELECT'?'change':'input';
        inp.addEventListener(ev,()=>{let v=inp.type==='checkbox'?inp.checked:inp.type==='number'?Math.max(0,+inp.value||0):inp.value;if(f==='anchor'){bl.forEach(x=>x.anchor=false);v=true}b[f]=v;markDirty();if(ev==='change')tabItin(el)});
        if(ev==='input'&&inp.type!=='text')inp.addEventListener('change',()=>tabItin(el))});
      row.querySelectorAll('[data-a]').forEach(btn=>btn.onclick=()=>{const i=bl.indexOf(b),a=btn.dataset.a;
        if(a==='up'&&i>0)[bl[i-1],bl[i]]=[bl[i],bl[i-1]];if(a==='dn'&&i<bl.length-1)[bl[i+1],bl[i]]=[bl[i],bl[i+1]];
        if(a==='del'){confirmIn(btn,'¿Quitar este momento?',()=>{bl.splice(bl.indexOf(b),1);markDirty();tabItin(el)});return}markDirty();tabItin(el)})})}
  $('#cpy').onclick=()=>copyText(itinText(w,pl))}
function sunRow(ss){return ss==null?'':`<div class="sunrow"><span class="tm">${hm(ss)}</span><span>Atardecer</span></div>`}
function blkRO(x){return `<div class="blk ${x.b.anchor?'anchor':''}"><div class="tm">${hm(x.t.s)}<small>${x.b.dur?'hasta '+hm(x.t.e):''}</small></div><div class="ti"><b>${esc(x.b.t)}</b>${x.b.note?`<div class="note">${esc(x.b.note)}</div>`:''}</div></div>`}
function blkEdit(x,w){const b=x.b;return `<div class="blk ${b.anchor?'anchor':''} ${b.couple?'':'hidden-c'}" data-b="${b.id}"><div class="tm">${hm(x.t.s)}<small>a ${hm(x.t.e)}</small>${b.anchor?'<small style="color:var(--accent);font-weight:700">Ancla</small>':''}</div>
  <div class="ti" style="min-width:0"><input type="text" data-f="t" value="${esc(b.t)}" aria-label="Momento"><div class="ex">
   <label class="row" style="gap:4px">Dura <input type="number" data-f="dur" min="0" step="5" value="${b.dur}"> min</label>
   <label class="row" style="gap:4px">Hora fija <input type="time" data-f="fixed" value="${esc(b.fixed||'')}"></label>
   <label class="row" style="gap:4px"><input type="checkbox" data-f="couple" ${b.couple?'checked':''}> La pareja lo ve</label>
   ${b.anchor?'':'<label class="row" style="gap:4px"><input type="radio" name="anc" data-f="anchor"> Ancla</label>'}</div>
   <input type="text" data-f="note" value="${esc(b.note||'')}" placeholder="Notas: proveedor, lugar, responsable…" style="margin-top:6px;font-size:13px"></div>
  <div class="ctl"><button class="btn sm" data-a="up" aria-label="Subir">↑</button><button class="btn sm" data-a="dn" aria-label="Bajar">↓</button><button class="btn sm danger" data-a="del" aria-label="Quitar">✕</button></div></div>`}
function itinText(w,pl){const {out,ss}=schedule(w);let s=`*Itinerario · ${w.couple||'Boda'}*\n${fdate(w.date)}${w.place?'\n'+w.place:''}\n\n`;
  w.itinerary.blocks.forEach((b,i)=>{if(!pl&&!b.couple)return;s+=`${hm(out[i].s)}  ${b.t}${b.note?' ('+b.note+')':''}\n`});if(ss!=null)s+=`\nAtardecer: ${hm(ss)}`;s+='\n\nMemories Weddings & Events';return s}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('Copiado. Ya lo puedes pegar en WhatsApp.')}catch(e){modal(`<h2>Copiar</h2><p class="note">Selecciona y copia el texto.</p><textarea style="min-height:260px;margin-top:10px" readonly>${esc(t)}</textarea><div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn" id="mX">Cerrar</button></div>`);$('#mX').onclick=closeModal;$('#sheet textarea').select()}}
function confirmIn(btn,msg,yes){const b=typeof btn==='string'?$(btn):btn;modal(`<h2 style="font-size:20px">${esc(msg)}</h2><div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn" id="mX">Cancelar</button><button class="btn primary" id="mOk">Sí</button></div>`);$('#mX').onclick=closeModal;$('#mOk').onclick=()=>{closeModal();yes()}}

/* Presupuesto */
function tabBudget(el){const w=V.w,pl=isPlanner(),B=w.budget,cur=w.currency||'MXN',t=totals(w,!pl);
  const items=B.items.filter(i=>pl||i.visible!==false);const cats=[...new Set([...CATS.filter(c=>items.some(i=>i.cat===c)),...items.map(i=>i.cat)])];
  el.innerHTML=`<div class="card"><div class="row" style="justify-content:space-between;gap:14px;align-items:flex-start"><div class="stats" style="flex:1 1 520px">
     <div class="stat"><b>${money(t.target,cur)}</b><span>Objetivo</span></div><div class="stat"><b>${money(t.proj,cur)}</b><span>Proyectado</span></div><div class="stat"><b>${money(t.comm,cur)}</b><span>Contratado</span></div><div class="stat"><b>${money(t.paid,cur)}</b><span>Pagado</span></div><div class="stat"><b>${money(t.due,cur)}</b><span>Por pagar</span></div></div>
     ${pl?`<div style="min-width:200px"><div class="field"><label for="tgt">Presupuesto objetivo</label><input type="number" id="tgt" min="0" step="1000" value="${B.target||''}" placeholder="0"></div><div class="field"><label for="curr">Moneda</label><select id="curr"><option value="MXN" ${cur==='MXN'?'selected':''}>Pesos (MXN)</option><option value="USD" ${cur==='USD'?'selected':''}>Dólares (USD)</option></select></div></div>`:''}</div>
     ${t.target?`<div class="bar" style="margin-top:6px"><i style="width:${Math.min(100,t.proj/t.target*100)}%;${t.proj>t.target?'background:var(--bad)':''}"></i></div><p class="note">${t.proj>t.target?`<span class="pill bad">${money(t.proj-t.target,cur)} arriba del objetivo</span>`:`Quedan ${money(t.target-t.proj,cur)} disponibles del objetivo`}</p>`:''}
     <p class="note">Proyectado usa la cotización cuando ya la hay y el estimado cuando todavía no. Se actualiza solo con cada cambio.</p></div>
   ${pl?`<div class="row" style="margin-top:14px"><select id="newCat" style="width:auto">${CATS.map(c=>`<option>${esc(c)}</option>`).join('')}</select><button class="btn primary sm" id="addI">+ Agregar concepto</button><button class="btn sm" id="addBase">Agregar lista básica</button><button class="btn sm" id="impX">Importar desde Excel</button></div>`:''}
   ${items.length?`<div class="bhead" style="margin-top:16px"><span>Concepto</span><span>Proveedor</span>${pl?'<span style="text-align:right">Estimado</span><span style="text-align:right">Cotización</span><span>Estado</span><span></span>':'<span style="text-align:right">Monto</span><span style="text-align:right">Pagado</span>'}</div>`:''}
   ${cats.map(c=>{const its=items.filter(i=>i.cat===c),sum=its.reduce((a,i)=>a+itemAmount(i),0);return `<div class="bcat"><h3>${esc(c)}<small>${money(sum,cur)}</small></h3>${its.map(i=>pl?bItemEdit(i,w):bItemRO(i,w)).join('')}</div>`}).join('')}
   ${!items.length?`<div class="card empty" style="margin-top:14px"><h2>Sin conceptos todavía</h2><p>${pl?'Agrega conceptos uno por uno o usa la lista básica de una boda.':'Tu planner aún no comparte el presupuesto.'}</p></div>`:''}`;
  if(!pl)return;
  const tg=$('#tgt');tg.oninput=()=>{B.target=+tg.value||0;markDirty()};tg.onchange=()=>tabBudget(el);$('#curr').onchange=e=>{w.currency=e.target.value;markDirty();tabBudget(el)};
  $('#impX').onclick=importExcel;
  $('#addI').onclick=()=>{const i={id:uid(),cat:$('#newCat').value,concept:'',vendor:'',est:0,quote:0,status:'estimado',payments:[],due:'',visible:true,note:'',doc:''};B.items.push(i);V.openItems.add(i.id);markDirty();tabBudget(el);el.querySelector(`[data-i="${i.id}"] [data-f="concept"]`)?.focus()};
  $('#addBase').onclick=()=>{const base=['Lugar','Banquete','Bebidas y barra','Fotografía','Video','Música y DJ','Flores y decoración','Mobiliario y mantelería','Pastel y postres','Belleza','Invitaciones y papelería','Ceremonia','Honorarios Memories'];
    let n=0;for(const c of base)if(!B.items.some(i=>i.cat===c)){B.items.push({id:uid(),cat:c,concept:c,vendor:'',est:0,quote:0,status:'estimado',payments:[],due:'',visible:c!=='Honorarios Memories'||true,note:'',doc:''});n++}markDirty();tabBudget(el);toast(n?`Agregué ${n} conceptos. Ponles el estimado.`:'Ya tienes todos los conceptos básicos.')};
  el.querySelectorAll('[data-i]').forEach(row=>{const i=B.items.find(x=>x.id===row.dataset.i);
    row.querySelectorAll('[data-f]').forEach(inp=>{const f=inp.dataset.f,ev=inp.type==='checkbox'||inp.tagName==='SELECT'?'change':'input';
      inp.addEventListener(ev,()=>{i[f]=inp.type==='checkbox'?inp.checked:inp.type==='number'?(+inp.value||0):inp.value;markDirty();if(ev==='change')tabBudget(el)});
      if(ev==='input'&&inp.type==='number')inp.addEventListener('change',()=>tabBudget(el))});
    row.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const a=b.dataset.a;
      if(a==='tog'){V.openItems.has(i.id)?V.openItems.delete(i.id):V.openItems.add(i.id);tabBudget(el)}
      if(a==='del')confirmIn(b,'¿Borrar este concepto?',()=>{B.items.splice(B.items.indexOf(i),1);markDirty();tabBudget(el)});
      if(a==='pay'){i.payments=i.payments||[];i.payments.push({id:uid(),date:new Date().toISOString().slice(0,10),amount:Math.max(0,itemAmount(i)-itemPaid(i)),note:''});markDirty();tabBudget(el)}});
    row.querySelectorAll('[data-p]').forEach(pr=>{const p=i.payments.find(x=>x.id===pr.dataset.p);pr.querySelectorAll('[data-pf]').forEach(inp=>{inp.addEventListener('input',()=>{p[inp.dataset.pf]=inp.type==='number'?(+inp.value||0):inp.value;markDirty()});inp.addEventListener('change',()=>tabBudget(el))});
      pr.querySelector('[data-pd]').onclick=()=>{i.payments.splice(i.payments.indexOf(p),1);markDirty();tabBudget(el)}})})}
function bItemEdit(i,w){const cur=w.currency,open=V.openItems.has(i.id),paid=itemPaid(i),bal=itemAmount(i)-paid,docs=V.docs;
  return `<div class="bitem" data-i="${i.id}"><div class="bsum"><input type="text" class="c-concept" data-f="concept" value="${esc(i.concept)}" placeholder="Concepto" aria-label="Concepto" title="${i.quoteId?'Cotización aprobada en la pestaña Cotizaciones':''}"><input type="text" data-f="vendor" value="${esc(i.vendor)}" placeholder="Proveedor" aria-label="Proveedor">
   <label class="ml"><span>Estimado</span><input type="number" class="money" data-f="est" min="0" step="100" value="${i.est||''}" placeholder="0" aria-label="Estimado"></label><label class="ml"><span>Cotización</span><input type="number" class="money" data-f="quote" min="0" step="100" value="${i.quote||''}" placeholder="0" aria-label="Cotización"></label>
   <label class="ml"><span>Estado</span><select data-f="status" aria-label="Estado">${STATUS.map(([v,n])=>`<option value="${v}" ${i.status===v?'selected':''}>${n}</option>`).join('')}</select></label><button class="btn sm tg" data-a="tog" aria-expanded="${open}" aria-label="Más detalles"><span class="tgl">${open?'Cerrar':'Pagos y detalles'}</span><span class="tgs">${open?'−':'+'}</span></button></div>
   ${open?`<div class="bdet"><div class="f2"><div class="field"><label>Fecha límite de pago</label><input type="date" data-f="due" value="${esc(i.due||'')}"></div>
     <div class="field"><label>Cotización o contrato</label><select data-f="doc"><option value="">Sin documento</option>${docs.map(d=>`<option value="${d.id}" ${i.doc===d.id?'selected':''}>${esc(d.name)}</option>`).join('')}</select></div>
     <div class="field"><label>Categoría</label><select data-f="cat">${[...new Set([...CATS,i.cat])].map(c=>`<option ${c===i.cat?'selected':''}>${esc(c)}</option>`).join('')}</select></div></div>
     <label class="row" style="font-size:13px"><input type="checkbox" data-f="visible" ${i.visible!==false?'checked':''}> La pareja ve este concepto</label>

const LIBS={xlsx:'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',mammoth:'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js'};
const libLoaded={};async function lib(n){if(!libLoaded[n]){await loadScript(LIBS[n]);libLoaded[n]=1}}
function aiCtx(){const w=V.w;return {pareja:w.couple,fecha:w.date,invitados:w.guests,moneda:w.currency||'MXN'}}
async function downscale(file,max){const url=URL.createObjectURL(file);const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('No se pudo abrir la imagen. Si es de iPhone (HEIC), mándala como JPG.'));i.src=url});
  const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);return c.toDataURL('image/jpeg',.85).split(',')[1]}
async function aiPayload(file,doc,mode){const n=file.name.toLowerCase(),t=file.type||'';
  if(/pdf/.test(t)||n.endsWith('.pdf'))return {mode,url:await Store.docUrl(doc),mime:'application/pdf'};
  if(/^image\//.test(t)||/\.(jpe?g|png|webp|gif|heic)$/.test(n))return {mode,b64:await downscale(file,2000),mime:'image/jpeg'};
  if(n.endsWith('.docx')){await lib('mammoth');const r=await mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()});return {mode,text:r.value}}
  if(/\.(xlsx|xls|csv)$/.test(n)){await lib('xlsx');const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});return {mode,text:wb.SheetNames.map(s=>'Hoja '+s+':\n'+XLSX.utils.sheet_to_csv(wb.Sheets[s])).join('\n\n')}}
  throw new Error('Formato no compatible. Sube PDF, foto, Word (.docx) o Excel.')}
function quoteFromAI(q,a){q.vendor=a.proveedor||q.vendor||'';q.category=CATS.includes(a.categoria)?a.categoria:(q.category||'Otros');q.currency=a.moneda||V.w.currency||'MXN';

  if(a.total==null)q.data.doubts.push('total');q.status='revisar';return q}

async function quoteUpload(files){files=files.filter(Boolean);if(!files.length)return;let i=0;

async function importExcel(){const inp=document.createElement('input');inp.type='file';inp.accept='.xlsx,.xls,.csv';inp.onchange=async()=>{const f=inp.files[0];if(!f)return;

  let hr=rows.findIndex(r=>r.filter(c=>Object.values(KEYS).some(k=>k.test(String(c)))).length>=2);if(hr<0)hr=0;const head=rows[hr].map(String);
  const det={};for(const [k,re] of Object.entries(KEYS)){const i=head.findIndex((h,ix)=>re.test(h)&&!Object.values(det).includes(ix));if(i>=0)det[k]=i}
  const body=rows.slice(hr+1).filter(r=>r.some(c=>String(c).trim()!==''));const num=v=>{if(typeof v==='number')return v;const n=parseFloat(String(v).replace(/[^\d.\-]/g,''));return isNaN(n)?0:n};
  const sel=(k,lbl)=>`<div class="field"><label>${lbl}</label><select data-map="${k}"><option value="">(no usar)</option>${head.map((h,i)=>`<option value="${i}" ${det[k]===i?'selected':''}>${esc(h||'Columna '+(i+1))}</option>`).join('')}</select></div>`;

      return {id:uid(),cat,concept,vendor:String(g('vendor')).trim(),est,quote,status:quote>0?'cotizado':'estimado',payments:paid>0?[{id:uid(),date:new Date().toISOString().slice(0,10),amount:paid,note:'Importado de Excel'}]:[],due:'',visible:true,note:'',doc:''}}).filter(Boolean)};

function guessCat(t){t=t.toLowerCase();const G=[['Lugar',/lugar|venue|hacienda|sal[oó]n|jard[ií]n|renta/],['Banquete',/banquete|cena|men[uú]|comida|catering|canap/],['Bebidas y barra',/barra|bebida|licor|vino|mixolog|bar\b/],['Fotografía',/fot[oó]/],['Video',/video|film/],['Música y DJ',/dj|m[uú]sica|banda|mariachi|sax|violin/],['Flores y decoración',/flor|decora|centro de mesa|arco/],['Mobiliario y mantelería',/mobiliario|silla|mesa|mantel|loza|cristaler/],['Iluminación y audio',/ilumina|luz|audio|sonido|pista/],['Pastel y postres',/pastel|postre|candy/],['Vestido y atuendo',/vestido|traje|smoking/],['Belleza',/maquill|peinado|belleza/],['Invitaciones y papelería',/invitaci|papeler|men[uú]s impresos|letrero/],['Ceremonia',/ceremonia|oficiante|juez|iglesia|misa/],['Transporte',/transporte|camioneta|auto|shuttle/],['Hospedaje',/hotel|hospedaje|villa/],['Honorarios Memories',/coordinaci|planner|memories|honorario/]];for(const [c,re] of G)if(re.test(t))return c;return ''}

function parseItin(txt){const out=[];let prev=null;for(const raw of txt.split(/\r?\n/)){const line=raw.replace(/^[\s•\-*·–—]+/,'').trim();if(!line)continue;
  const m=line.match(/^(\d{1,2})(?:[:.h](\d{2}))?\s*(a\.?\s?m\.?|p\.?\s?m\.?|hrs?\.?|h\b)?\s*(?:[-–—:|·]|a\s+\d{1,2}(?::\d{2})?\s*(?:a\.?\s?m\.?|p\.?\s?m\.?)?)?\s*(.*)$/i);
  if(!m||!/\d/.test(line.slice(0,2))||!m[4]){if(out.length)out[out.length-1].note=(out[out.length-1].note?out[out.length-1].note+' · ':'')+line;continue}
  let h=+m[1],mi=+(m[2]||0);const ap=(m[3]||'').toLowerCase().replace(/[\s.]/g,'');if(h>23||mi>59)continue;
  if(ap.startsWith('p')&&h<12)h+=12;else if(ap.startsWith('a')&&h===12)h=0;else if(!ap&&h<12&&h>=1&&h<=11&&(prev==null?h<=10:prev>=12*60))h+=12;
  let t=h*60+mi;if(prev!=null&&t<prev-120)t+=1440;out.push({t,title:m[4].replace(/^[-–—:|·\s]+/,'').trim(),note:''});prev=t}
  return out}

  $('#mX').onclick=closeModal;const ss=sunsetMin(w);
  const prev=()=>{const it=parseItin($('#itTxt').value);const ai=it.findIndex(x=>/ceremonia|boda civil|bendici/i.test(x.title));
    $('#itPrev').innerHTML=it.length?`<p class="note"><b>${it.length} momentos</b> encontrados.</p><div class="upc" style="max-height:220px;overflow:auto">${it.map((x,i)=>`<div><span>${esc(x.title)}${x.note?`<br><small class="muted">${esc(x.note)}</small>`:''}</span><span class="money">${hm(x.t)}</span></div>`).join('')}</div>
     <fieldset style="border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:10px"><legend class="eyebrow" style="padding:0 6px">¿Cómo lo guardo?</legend>
     <label class="row" style="font-size:13px"><input type="radio" name="itm" value="sun" ${ss!=null?'checked':''} ${ss==null?'disabled':''}> Ligarlo al atardecer: si cambia la fecha, todo se recorre solo</label>
     <div class="row" style="margin:6px 0 8px 24px;font-size:13px"><span>Momento ancla:</span><select id="itA" style="width:auto">${it.map((x,i)=>`<option value="${i}" ${i===(ai<0?0:ai)?'selected':''}>${esc(x.title)}</option>`).join('')}</select></div>
     <label class="row" style="font-size:13px"><input type="radio" name="itm" value="fix" ${ss==null?'checked':''}> Dejar las horas fijas</label>${ss==null?'<p class="note">Para ligarlo al atardecer, primero pon fecha y destino en "Datos y acceso".</p>':''}</fieldset>`:'';
    $('#mOk').disabled=!it.length};
  $('#itTxt').oninput=prev;
  $('#itFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;const msg=$('#itMsg');msg.textContent='Leyendo con IA…';
    try{const doc=await Store.uploadDoc(V.id,f,{kind:'otro',visible:false});V.docs.unshift(doc);const p=await aiPayload(f,doc,'itinerario');p.context=aiCtx();const r=await Store.ai(p);
      $('#itTxt').value=(r.data.momentos||[]).map(m=>{const [h,mi]=m.hora.split(':').map(Number);return `${hm(h*60+mi)} ${m.momento}${m.notas?'\n'+m.notas:''}`}).join('\n');msg.textContent=(r.data.dudosos||[]).length?'Revisa: '+r.data.dudosos.join(', '):'Listo. Revisa las horas.';prev()}catch(err){msg.textContent=err.message}};
  $('#mOk').onclick=()=>{const it=parseItin($('#itTxt').value);if(!it.length)return;const mode=(document.querySelector('[name="itm"]:checked')||{}).value||'fix',a=+($('#itA')?.value||0);
    const blocks=it.map((x,i)=>({id:uid(),t:x.title,dur:Math.max(5,i<it.length-1?it[i+1].t-x.t:30),anchor:mode==='sun'&&i===a,fixed:'',couple:true,note:x.note||''}));
    if(mode==='fix'){blocks.forEach((b,i)=>{const t=((it[i].t%1440)+1440)%1440;b.fixed=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')});w.itinerary.blocks=blocks}
    else{w.itinerary.blocks=blocks;w.itinerary.lead=Math.round(ss-it[a].t);w.itinerary.round=false}
    markDirty();closeModal();tabItin($('#tab'));toast(mode==='sun'?`Listo. La ceremonia queda ${w.itinerary.lead} min antes del atardecer.`:'Itinerario cargado con horas fijas.')}}

/* ---------- Acceso ---------- */
function renderLogin(){$('#app').innerHTML=`<main class="login"><p class="eyebrow">Weddings &amp; Events</p><h1>Memories</h1><p class="muted" style="margin:6px 0 18px">Portal de bodas</p>
  <div class="card"><div class="seg" role="group" style="margin-bottom:16px"><button data-lm="couple" aria-pressed="true">Soy novio o novia</button><button data-lm="planner" aria-pressed="false">Soy la planner</button></div><div id="lf"></div></div></main>`;
  const draw=m=>{document.querySelectorAll('[data-lm]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lm===m));const f=$('#lf');
    if(m==='couple'){f.innerHTML=`<div class="field"><label for="le">Tu correo</label><input type="email" id="le" autocomplete="email" placeholder="tu@correo.com"></div><div class="field"><label for="lp">Contraseña</label><input type="password" id="lp" autocomplete="current-password"></div><button class="btn primary" id="lgo" style="width:100%;justify-content:center">Entrar a mi boda</button><p class="note">Usa el correo y la contraseña que te dio tu wedding planner.</p>`;
      const go=async()=>{const e=$('#le').value.trim(),p=$('#lp').value;if(!e||!p)return toast('Escribe tu correo y contraseña.');try{await Store.signIn(e,p)}catch(err){toast(/invalid/i.test(err.message)?'Correo o contraseña incorrectos.':err.message)}};$('#lgo').onclick=go;$('#lp').onkeydown=ev=>{if(ev.key==='Enter')go()}}
    else{f.innerHTML=`<div class="field"><label for="le">Correo</label><input type="email" id="le" autocomplete="email"></div><div class="field"><label for="lp">Contraseña</label><input type="password" id="lp" autocomplete="current-password"></div>
      <div class="row"><button class="btn primary" id="lin">Entrar</button><button class="btn" id="lup">Crear cuenta</button></div><p class="note">La primera vez toca "Crear cuenta".</p>`;
      $('#lin').onclick=async()=>{try{await Store.signIn($('#le').value.trim(),$('#lp').value)}catch(e){toast(e.message==='Invalid login credentials'?'Correo o contraseña incorrectos.':e.message)}};
      $('#lup').onclick=async()=>{const e=$('#le').value.trim(),p=$('#lp').value;if(p.length<8)return toast('La contraseña debe tener al menos 8 caracteres.');LS.set('mw.wantPlanner',e.toLowerCase());try{const r=await Store.signUp(e,p);if(r.session){await Store.becomePlanner();route()}else{LS.set('mw.wantPlanner',e.toLowerCase());f.innerHTML=`<h3>Confirma tu correo</h3><p class="note">Te mandamos un correo a <b>${esc(e)}</b>. Ábrelo y después entra aquí con tu contraseña.</p>`}}catch(err){toast(err.message)}}}};
  document.querySelectorAll('[data-lm]').forEach(b=>b.onclick=()=>draw(b.dataset.lm));draw('couple')}

/* ---------- Inicio ---------- */
(async()=>{$('#app').innerHTML='<p class="empty">Cargando…</p>';
  try{await Store.init()}catch(e){$('#app').innerHTML=`<div class="login"><div class="card"><h2>No se pudo conectar</h2><p class="note">${esc(e.message)}. Revisa tu conexión a internet y recarga la página.</p></div></div>`;return}
  if(!DEMO&&Store.user&&Store.role==='couple'&&LS.get('mw.wantPlanner')===Store.email()){await Store.becomePlanner().catch(()=>{});LS.set('mw.wantPlanner','')}
  if(DEMO&&!Store.demo().weddings.length)seedDemo();
  route()})();
