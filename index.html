<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2E5B4A">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232E5B4A'/%3E%3Ctext x='32' y='43' font-family='Georgia' font-size='34' text-anchor='middle' fill='%23F3EAD7'%3EM%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232E5B4A'/%3E%3Ctext x='32' y='43' font-family='Georgia' font-size='34' text-anchor='middle' fill='%23F3EAD7'%3EM%3C/text%3E%3C/svg%3E">
<title>Memories Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Bodoni+Moda:wght@500&family=Allura&family=Josefin+Sans:wght@300;400;600&display=swap">
<style>
/* Layout: app de trabajo — barra superior, lista de bodas y ficha de cada boda con pestañas */
:root{
  --bg:#F1F3EF; --surface:#FFFFFF; --surface-2:#F6F8F4; --ink:#1E2A24; --muted:#5D6A62; --line:#D7DED5;
  --accent:#2E5B4A; --accent-ink:#FFFFFF; --accent-soft:#DDE9E2; --gold:#A9843F; --gold-soft:#F3EAD7;
  --ok:#2F7A4F; --warn:#B26A1E; --bad:#A13A3A;
  --font-display:'Marcellus','Cormorant Garamond',Georgia,serif;
  --font-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111714; --surface:#18201C; --surface-2:#1E2823; --ink:#E6ECE8; --muted:#9BA9A0; --line:#2E3B34;
  --accent:#8CC4AA; --accent-ink:#0E1A14; --accent-soft:#233429; --gold:#D4B477; --gold-soft:#3A3122;
  --ok:#7CC79A; --warn:#E3A35A; --bad:#E58989; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#111714; --surface:#18201C; --surface-2:#1E2823; --ink:#E6ECE8; --muted:#9BA9A0; --line:#2E3B34;
  --accent:#8CC4AA; --accent-ink:#0E1A14; --accent-soft:#233429; --gold:#D4B477; --gold-soft:#3A3122;
  --ok:#7CC79A; --warn:#E3A35A; --bad:#E58989; color-scheme:dark }
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;align-items:center;gap:10px;padding-block:10px;padding-inline:16px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.05;cursor:pointer}
.brand b{font-family:var(--font-display);font-weight:400;font-size:22px;color:var(--accent);letter-spacing:.02em}
.brand span{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:600}
.top .sp{flex:1}
.who{font-size:12.5px;color:var(--muted);max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:13px}
.seg{display:inline-flex;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button{border:0;background:none;border-radius:7px;padding:4px 10px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.wrap{max-width:1120px;margin:0 auto;padding-block:20px 60px;padding-inline:16px}
h1,h2,h3{font-family:var(--font-display);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:30px}h2{font-size:22px}h3{font-size:18px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin:0 0 6px}
.muted{color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.grid{display:grid;gap:14px}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px}
.wlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.wcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;display:grid;gap:8px;text-align:left}
.wcard:hover{border-color:var(--accent)}
.wcard h3{font-size:20px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--accent-soft);color:var(--ink)}
.pill.gold{background:var(--gold-soft)}
.pill.warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.pill.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.whead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 20px;margin-bottom:14px}
.whead h1{flex:1 1 280px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.field{display:grid;gap:5px;margin-bottom:12px;min-width:0}
.field>label{font-size:12px;font-weight:600;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{min-width:0}
.f2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:0 12px}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=time],select,textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:7px 9px;width:100%}
textarea{resize:vertical;min-height:80px}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
input[readonly],input:disabled,select:disabled{opacity:.75}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--surface-2);border-radius:12px;padding:12px}
.stat b{display:block;font-family:var(--font-mono);font-weight:500;font-size:19px;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--muted)}
.big{font-family:var(--font-display);font-size:40px;line-height:1;color:var(--accent)}
/* itinerario */
.itin{display:grid;gap:6px}
.blk{display:grid;grid-template-columns:118px minmax(0,1fr) auto;gap:10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.blk.anchor{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.blk.hidden-c{opacity:.6}
.blk .tm{font-family:var(--font-mono);font-size:13px;font-variant-numeric:tabular-nums;line-height:1.3}
.blk .tm small{display:block;color:var(--muted);font-size:11.5px}
.blk .ti input{font-weight:600}
.blk .ctl{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.blk .ex{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:6px;font-size:12.5px;color:var(--muted);align-items:center}
.blk .ex input[type=number]{width:72px;padding:4px 6px}
.blk .ex input[type=time]{width:auto;padding:4px 6px}
.sunrow{display:flex;align-items:center;gap:10px;padding:6px 12px;border-radius:10px;background:linear-gradient(90deg,var(--gold-soft),transparent);font-size:13px;font-weight:600;color:var(--gold)}
.sunrow .tm{font-family:var(--font-mono);min-width:106px}
.ro .blk{grid-template-columns:118px minmax(0,1fr)}
/* presupuesto */
.bcat{margin-top:18px}
.bcat h3{display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-size:17px;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:6px}
.bcat h3 small{font-family:var(--font-mono);font-size:13px;color:var(--muted)}
.bitem{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-top:6px}
.bsum{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.3fr) 110px 110px 110px 34px;gap:8px;align-items:center;padding:8px 10px}
.bsum input,.bsum select{padding:5px 7px}
.ml{display:block;min-width:0}.ml span{display:none}.ml input,.ml select{width:100%}
.tg .tgl{display:none}
.money{font-family:var(--font-mono);font-variant-numeric:tabular-nums;text-align:right}
.bdet{border-top:1px dashed var(--line);padding:10px;display:grid;gap:8px}
.bhead{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.3fr) 110px 110px 110px 34px;gap:8px;padding:0 10px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.pays{display:grid;gap:4px}
.pay{display:grid;grid-template-columns:140px 130px minmax(0,1fr) 30px;gap:6px;align-items:center}
.ro .bsum{grid-template-columns:minmax(0,2fr) minmax(0,1.3fr) 120px 120px}
.ro .bhead{grid-template-columns:minmax(0,2fr) minmax(0,1.3fr) 120px 120px}
@media (max-width:760px){
  .bhead{display:none}
  .bsum,.ro .bsum{grid-template-columns:1fr 1fr}
  .bsum .c-concept{grid-column:1/-1}
  .ml span{display:block;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
  .tg{grid-column:1/-1;justify-content:center}.tg .tgl{display:inline}.tg .tgs{display:none}
  .bsum .lbl-m::before{content:attr(data-l);display:block;font-family:var(--font-body);font-size:10.5px;color:var(--muted);text-align:left;text-transform:uppercase;letter-spacing:.06em}
  .pay{grid-template-columns:1fr 1fr}
  .blk,.ro .blk{grid-template-columns:1fr}
  .blk .ctl{justify-content:flex-start}
}
/* documentos */
.docs{display:grid;gap:8px}
.doc{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.doc .ic{width:40px;height:40px;border-radius:10px;background:var(--gold-soft);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--gold);text-transform:uppercase}
.doc .nm{font-weight:600;overflow-wrap:anywhere}
.drop{border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted);background:var(--surface-2)}
.drop.on{border-color:var(--accent);background:var(--accent-soft)}
/* login */
.login{max-width:420px;margin:8vh auto;padding-inline:16px}
.login .card{padding:24px}
.login h1{font-size:34px;color:var(--accent)}
.status{font-size:12px;color:var(--muted);min-width:70px;text-align:right}
.qsec{margin-top:22px}.qsec>summary{cursor:pointer;list-style:none}.qsec>summary::-webkit-details-marker{display:none}
.qcat{font-size:15px;color:var(--muted);margin:14px 0 6px}
.qlist{display:grid;gap:8px}
.qcard{display:flex;gap:12px;justify-content:space-between;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.qright{display:flex;align-items:center;gap:10px;flex:none}
.cmp{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:10px}
.cmpc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.sheet.wide{width:min(1180px,100%);height:min(92vh,100%)}
.rv{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;height:calc(100% - 60px);min-height:0}
.rvp{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;overflow:auto;min-height:300px;display:flex;flex-direction:column}
.rvf{overflow:auto;padding-right:4px;min-width:0}
.qitems{display:grid;gap:6px}
.qit{display:grid;grid-template-columns:minmax(0,2.4fr) 64px 92px 104px 30px;gap:6px;align-items:center;border-radius:8px}
.qit input{padding:5px 7px}
.doubt input,.doubt select,.qit.doubt{background:color-mix(in srgb,var(--warn) 16%,var(--surface-2))!important;border-color:var(--warn)!important}
.field.doubt>label::after{content:' · confirmar';color:var(--warn)}
.appr{border-top:1px solid var(--line);margin-top:8px;padding-top:12px;position:sticky;bottom:0;background:var(--surface)}
@media (max-width:860px){.rv{grid-template-columns:1fr;height:auto}.rvp{max-height:45vh}.sheet.wide{height:auto}.qit{grid-template-columns:1fr 1fr 1fr 34px}.qit input[data-if="concept"]{grid-column:1/-1}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;z-index:50;max-width:calc(100% - 32px)}
.modal{position:fixed;inset:0;background:rgba(10,15,12,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:40}
.sheet{background:var(--surface);border-radius:14px;padding:20px;width:min(520px,100%);max-height:100%;overflow:auto}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty h2{color:var(--ink);margin-bottom:6px}
.demo{background:var(--gold-soft);color:var(--ink);font-size:12px;padding-block:6px;padding-inline:16px;text-align:center}
.cdown{display:flex;align-items:baseline;gap:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600}
.upc{display:grid;gap:6px}
.upc div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px;font-size:13px}
.upc .money{white-space:nowrap}
/* fase 3 */
html{-webkit-text-size-adjust:100%}
body{overflow-x:hidden}
.langseg button{padding:3px 8px}
.wc-top{display:flex;gap:12px;align-items:center}
.wcwrap{position:relative;display:grid}.wcwrap .wcard{padding-right:52px}
.wcdel{position:absolute;top:10px;right:10px;z-index:1;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:flex;align-items:center;justify-content:center}
.wcdel:hover{color:var(--bad);border-color:var(--bad)}.wcdel svg{width:18px;height:18px}
.avatar{border-radius:50%;object-fit:cover;flex:none;display:inline-block;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.avatar.mono{display:inline-flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--gold-soft),var(--accent-soft));color:var(--accent);font-family:var(--font-display)}
.finder{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:4px 0 6px}
.search{flex:1 1 260px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:0 12px}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{border:0!important;background:none!important;padding:10px 0!important;outline:none}
.years{display:flex;gap:6px;flex-wrap:wrap}
.years button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-weight:600;font-size:13px;color:var(--muted)}
.years button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ygroup{margin-top:18px}.ygroup h2{margin-bottom:10px}.ygroup h2 small{font-family:var(--font-body);font-size:13px;color:var(--muted)}
.hero{display:flex;flex-wrap:wrap;align-items:center;gap:16px 22px;background:linear-gradient(120deg,var(--gold-soft),var(--accent-soft));border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px}
.hero-ph{position:relative;flex:none}
.hero .avatar{border-width:3px}
.phbtn{position:absolute;right:0;bottom:2px;width:34px;height:34px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.phbtn svg{width:17px;height:17px}
.hero-tx{flex:1 1 240px;min-width:0;margin:0;display:block}
.hero-tx h1{font-size:34px;margin:2px 0 8px}
.welcome{font-family:var(--font-display);color:var(--gold);font-size:16px;margin:0 0 4px}
.hero-cd{text-align:center;background:var(--surface);border-radius:14px;padding:10px 16px;display:grid;line-height:1.1;border:1px solid var(--line)}
.hero-cd span:last-child{font-size:12px;color:var(--muted)}
fieldset.choice{border:0;padding:0;margin:4px 0 12px}
fieldset.choice legend{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;padding:0}
.seg.big2{display:grid;grid-template-columns:1fr 1fr;width:100%}
.seg.big2 label{position:relative;display:block}
.seg.big2 input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.seg.big2 span{display:block;text-align:center;padding:9px 8px;border-radius:7px;font-weight:600;color:var(--muted)}
.seg.big2 input:checked+span{background:var(--accent);color:var(--accent-ink)}
.seg.big2 input:focus-visible+span{outline:2px solid var(--gold)}
.ipal .sw.big{margin-top:4px}
.sw{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.swc{border:0;background:none;padding:0;display:grid;justify-items:center;gap:2px;cursor:pointer}
.swc i{display:block;width:28px;height:28px;border-radius:50%;border:1px solid var(--line)}
.sw.big .swc i{width:54px;height:54px;border-radius:14px}
.swc b{font-family:var(--font-body);font-size:12px;font-weight:600;max-width:84px;text-align:center}.swc small{font-family:var(--font-mono);font-size:10.5px;color:var(--muted)}
.iai{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px 18px;margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
.iai .istyle{grid-column:1/-1;font-family:var(--font-display);font-size:18px;margin:0}
.iai ul{margin:0;padding-left:18px;font-size:13px}
.isec{margin-top:22px}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(46%,150px),1fr));gap:8px;margin-top:8px}
.ith{position:relative;margin:0;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line);cursor:zoom-in}
.ith img{width:100%;height:100%;object-fit:cover;display:block}
.ix{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:13px}
.bprev{margin:12px 0;max-height:45vh;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface-2)}
.bprev h3{display:flex;justify-content:space-between;gap:8px;font-size:16px;margin:10px 0 4px;border-bottom:1px solid var(--line);padding-bottom:4px}.bprev h3:first-child{margin-top:0}
.bprev h3 small{font-family:var(--font-mono);font-size:12.5px;color:var(--muted)}
.bprev>div{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:3px 0}
.bprev .tot{border-top:2px solid var(--line);margin-top:8px;padding-top:8px;font-weight:700}
.qline{font-size:12px;color:var(--muted);padding:6px 10px 0;display:flex;flex-wrap:wrap;gap:4px 10px}
.qhead{display:grid;grid-template-columns:minmax(0,2.4fr) 64px 92px 104px 30px;gap:6px;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-bottom:4px}
.qsecin{font-weight:700;text-transform:none;margin-top:8px;background:var(--gold-soft)!important}

.qtaxes{display:grid;gap:6px}.qtx{display:grid;grid-template-columns:minmax(0,1fr) 120px 30px;gap:6px}
.callout{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;background:var(--gold-soft);border-radius:10px;padding:10px 12px;margin:0 0 10px;font-size:13px}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp 1s linear infinite;flex:none}@keyframes sp{to{transform:rotate(360deg)}}
.note.err{color:var(--bad);font-weight:600}
.btn{text-decoration:none}

.oday{margin-top:10px}.oitem{display:grid;grid-template-columns:110px minmax(0,1.3fr) minmax(0,1fr) 34px;gap:6px}
@media (max-width:760px){.oitem{grid-template-columns:110px minmax(0,1fr) 34px}.oitem [data-if="note"]{grid-column:1/3;grid-row:2}}
.rcp{display:grid;gap:6px}.rcp label{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;flex-wrap:nowrap;cursor:pointer}.rcp label span{min-width:0;overflow-wrap:anywhere}
.igrid>.note{grid-column:1/-1}

  .tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;border-bottom:0;overflow:visible}
  .tabs button{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 4px;font-size:13px;white-space:normal;line-height:1.15}
  .tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .tabs.t4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bsum>span.muted{grid-column:1/-1}.bsum .lbl-m{text-align:left}
  .sheet{padding:16px;max-height:calc(100dvh - 24px)}.modal{padding:12px}
  .qhead{display:none}.qtx{grid-template-columns:minmax(0,1fr) 110px 30px}
  .wrap{padding-block:14px 60px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- Atardecer ---------- */
function sunTimes(ds,lat,lng){if(!ds||lat==null||lng==null)return null;const r=Math.PI/180,[y,m,d]=ds.split('-').map(Number);const Jd=Date.UTC(y,m-1,d,12)/864e5+2440587.5;
  const n=Math.ceil(Jd-2451545+.0008),Js=n-lng/360,M=(357.5291+.98560028*Js)%360,C=1.9148*Math.sin(M*r)+.02*Math.sin(2*M*r)+.0003*Math.sin(3*M*r),L=(M+C+180+102.9372)%360,
  Jt=2451545+Js+.0053*Math.sin(M*r)-.0069*Math.sin(2*L*r),sd=Math.sin(L*r)*Math.sin(23.4397*r),cd=Math.cos(Math.asin(sd)),cw=(Math.sin(-.833*r)-Math.sin(lat*r)*sd)/(Math.cos(lat*r)*cd);
  if(cw<-1||cw>1)return null;const w=Math.acos(cw)/r,toD=J=>new Date((J-2440587.5)*864e5);return {rise:toD(Jt-w/360),set:toD(Jt+w/360)}}
function minsIn(date,tz){const p=new Intl.DateTimeFormat('en-GB',{timeZone:tz||'America/Mazatlan',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(date);return +p.find(x=>x.type==='hour').value*60+ +p.find(x=>x.type==='minute').value}
function hm(min){if(min==null||isNaN(min))return '—';min=((Math.round(min)%1440)+1440)%1440;let h=Math.floor(min/60),m=min%60;const ap=LANG==='en'?(h>=12?'PM':'AM'):(h>=12?'p.m.':'a.m.');h=h%12||12;return `${h}:${String(m).padStart(2,'0')} ${ap}`}
const toMin=s=>{if(!s)return null;const [h,m]=s.split(':').map(Number);return h*60+m};
function sunsetMin(w){const L=w.loc||{};const s=sunTimes(w.date,L.lat,L.lng);return s?minsIn(s.set,L.tz):null}
function schedule(w){const it=w.itinerary||{},bl=it.blocks||[],lead=it.lead??90,round=it.round!==false;const ss=sunsetMin(w);const out=bl.map(()=>({s:0,e:0}));
  let a=bl.findIndex(b=>b.anchor);let aStart;
  if(a<0){a=0;aStart=toMin(bl[0]?.fixed)??960}else aStart=bl[a].fixed?toMin(bl[a].fixed):ss!=null?ss-lead:toMin('17:00');
  if(round&&!(bl[a]&&bl[a].fixed))aStart=Math.floor(aStart/5)*5;
  if(!bl.length)return {out,ss};
  out[a]={s:aStart,e:aStart+(+bl[a].dur||0)};
  let next=aStart;for(let i=a-1;i>=0;i--){const s=bl[i].fixed?toMin(bl[i].fixed):next-(+bl[i].dur||0);out[i]={s,e:s+(+bl[i].dur||0)};next=s}
  let prev=out[a].e;for(let i=a+1;i<bl.length;i++){const s=bl[i].fixed?toMin(bl[i].fixed):prev;out[i]={s,e:s+(+bl[i].dur||0)};prev=out[i].e}
  return {out,ss}}

function fdate(ds,opt){if(!ds)return 'Sin fecha';const [y,m,d]=ds.split('-').map(Number);return new Date(Date.UTC(y,m-1,d,12)).toLocaleDateString(LANG==='en'?'en-US':'es-MX',Object.assign({timeZone:'UTC',weekday:'long',day:'numeric',month:'long',year:'numeric'},opt||{}))}
function daysTo(ds){if(!ds)return null;const [y,m,d]=ds.split('-').map(Number);const t=new Date();const a=Date.UTC(t.getFullYear(),t.getMonth(),t.getDate()),b=Date.UTC(y,m-1,d);return Math.round((b-a)/864e5)}
function daysLbl(n){if(n==null)return '';if(n===0)return 'Es hoy';if(n<0)return `Hace ${-n} días`;return n===1?'Falta 1 día':`Faltan ${n} días`}

const OLDCAT={'Banquete':'Alimentos y bebidas','Bebidas y barra':'Alimentos y bebidas'};
function migrate(w){const B=w.budget;if(B&&!B.v2){for(const i of B.items||[])if(OLDCAT[i.cat])i.cat=OLDCAT[i.cat];B.v2=1}w.extra=w.extra&&typeof w.extra==='object'?w.extra:{};return w}
function fixQ(q){if(OLDCAT[q.category])q.category=OLDCAT[q.category];return q}
function itemAmount(i){if(i.status==='descartado')return 0;if(+i.quote>0)return +i.quote;return +i.est||0}
function itemPaid(i){return (i.payments||[]).reduce((a,p)=>a+(+p.amount||0),0)}
function totals(w,coupleOnly){const items=(w.budget?.items||[]).filter(i=>!coupleOnly||i.visible!==false);let est=0,proj=0,comm=0,paid=0;
  for(const i of items){if(i.status==='descartado')continue;est+=+i.est||0;proj+=itemAmount(i);if(i.status==='contratado')comm+=itemAmount(i);paid+=itemPaid(i)}
  return {est,proj,comm,paid,due:Math.max(0,comm-paid),target:+w.budget?.target||0}}

  const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);

/* Paleta: k-means sobre una muestra de pixeles */
function paletteOf(c){const S=64,t=document.createElement('canvas');t.width=S;t.height=Math.max(1,Math.round(S*c.height/c.width));const x=t.getContext('2d');x.drawImage(c,0,0,t.width,t.height);const d=x.getImageData(0,0,t.width,t.height).data,px=[];

  let as=new Array(px.length).fill(0);for(let it=0;it<10;it++){const sum=cs.map(()=>[0,0,0,0]);px.forEach((p,i)=>{let b=0,bd=1e9;cs.forEach((c,k)=>{const dd=(p[0]-c[0])**2+(p[1]-c[1])**2+(p[2]-c[2])**2;if(dd<bd){bd=dd;b=k}});as[i]=b;const s2=sum[b];s2[0]+=p[0];s2[1]+=p[1];s2[2]+=p[2];s2[3]++});cs=cs.map((c,k)=>sum[k][3]?[sum[k][0]/sum[k][3],sum[k][1]/sum[k][3],sum[k][2]/sum[k][3]]:c)}

      if(l.bullet){doc.setFillColor(...INK);doc.circle(M+LW+4,yy-1.2,.7,'F')}

const COARSE_SHARE=matchMedia('(pointer:coarse)').matches;
function rr(x,X,Y,W,H,R){x.beginPath();x.moveTo(X+R,Y);x.arcTo(X+W,Y,X+W,Y+H,R);x.arcTo(X+W,Y+H,X,Y+H,R);x.arcTo(X,Y+H,X,Y,R);x.arcTo(X,Y,X+W,Y,R);x.closePath()}
async function loadPic(url){const bl=await (await fetch(url)).blob();const u=URL.createObjectURL(bl);const im=new Image();await new Promise((r,j)=>{im.onload=r;im.onerror=j;im.src=u});return im}
async function paletteCard(w,pal,ai,docs){await fontsReady();const logo=await logoImg();const W=1080,H=1350,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');const en=LANG==='en';
  x.fillStyle='#FBF8F3';x.fillRect(0,0,W,H);x.strokeStyle='#E7DFD2';x.lineWidth=2;rr(x,28,28,W-56,H-56,26);x.stroke();
  const lw=560,lh=lw*logo.h/logo.w;x.drawImage(logo.im,(W-lw)/2,70,lw,lh);let y=70+lh+56;
  const sp=t=>{if('letterSpacing' in x)x.letterSpacing=t};
  x.textAlign='center';x.fillStyle='#A9843F';x.font='600 24px "Josefin Sans", Arial, sans-serif';sp('6px');x.fillText(en?'COLOR PALETTE':'PALETA DE COLORES',W/2,y);sp('0px');y+=62;
  x.fillStyle='#2B2F2C';x.font='500 54px "Bodoni Moda", Georgia, serif';x.fillText(w.couple||'',W/2,y);y+=44;
  if(w.date){x.fillStyle='#7A7F7C';x.font='300 26px "Josefin Sans", Arial, sans-serif';x.fillText(ordDate(w.date)+(w.place?'  ·  '+w.place:''),W/2,y)}y+=56;
  const n=pal.length,cols=n<=3?n:3,rows=Math.ceil(n/3),sw=270,sh=rows>1?180:240,gx=40,gy=112,tw=cols*sw+(cols-1)*gx;
  pal.forEach((c,i)=>{const r=Math.floor(i/3),k=i%3,inRow=Math.min(3,n-r*3),rw=inRow*sw+(inRow-1)*gx,X=(W-rw)/2+k*(sw+gx),Y=y+r*(sh+gy);
    x.fillStyle=c.hex;rr(x,X,Y,sw,sh,22);x.fill();x.strokeStyle='rgba(0,0,0,.08)';x.lineWidth=2;x.stroke();
    const rgb=[1,3,5].map(j=>parseInt(c.hex.slice(j,j+2),16)).join(', ');x.fillStyle='#2B2F2C';x.font='400 28px "Josefin Sans", Arial, sans-serif';x.fillText(c.nombre||colorName(c.hex),X+sw/2,Y+sh+36);
    x.fillStyle='#8A8F8C';x.font='19px "IBM Plex Mono", monospace';x.fillText(c.hex.toUpperCase(),X+sw/2,Y+sh+62);x.fillText('RGB '+rgb,X+sw/2,Y+sh+86)});
  y+=rows*(sh+gy)+10;
  const pics=[];for(const k of ['flores','ceremonia','decoracion']){const d=docs.find(z=>(z.section||'decoracion')===k);if(d)pics.push(d)}for(const d of docs)if(pics.length<3&&!pics.includes(d))pics.push(d);
  const room=H-90-y;if(pics.length&&room>200){const ps=Math.min(300,room-(ai?.estilo?70:20)),gap=24,tot=pics.length*ps+(pics.length-1)*gap;let X=(W-tot)/2;
    const urls=await signedMany(pics.filter(d=>!V_URL[d.id])).catch(()=>({}));Object.assign(V_URL,urls);
    for(const d of pics){try{const im=await loadPic(V_URL[d.id]);const s=Math.max(ps/im.width,ps/im.height),iw=im.width*s,ih=im.height*s;x.save();rr(x,X,y,ps,ps,20);x.clip();x.drawImage(im,X+(ps-iw)/2,y+(ps-ih)/2,iw,ih);x.restore()}catch(e){}X+=ps+gap}y+=ps+46}
  if(ai?.estilo&&y<H-110){x.fillStyle='#5D6360';x.font='italic 26px Georgia, serif';const words=ai.estilo.split(' ');let line='',ly=y;for(const wd of words){const t=line?line+' '+wd:wd;if(x.measureText(t).width>880){x.fillText(line,W/2,ly);ly+=36;line=wd}else line=t}if(line&&ly<H-90)x.fillText(line,W/2,ly)}
  x.fillStyle='#A9A49A';x.font='400 18px "Josefin Sans", Arial, sans-serif';sp('4px');x.fillText('MEMORIES · '+(brand().tagline||'').toUpperCase(),W/2,H-58);sp('0px');
  return await new Promise(r=>c.toBlob(r,'image/png'))}

function wordText(html){const d=document.createElement('div');d.innerHTML=html;d.querySelectorAll('table').forEach(t=>{const lines=[...t.querySelectorAll('tr')].map(tr=>[...tr.children].map(c=>c.textContent.replace(/\s+/g,' ').trim()).join(' | '));const pre=document.createElement('pre');pre.textContent='\n[Tabla]\n'+lines.join('\n')+'\n';t.replaceWith(pre)});

async function aiPayload(file,doc,mode){const n=file.name.toLowerCase(),t=file.type||'';

  if(/^image\//.test(t)||/\.(jpe?g|png|webp|gif|heic)$/.test(n))return {mode,b64:await downscale(file,2000),mime:'image/jpeg'};
  if(n.endsWith('.docx')){await lib('mammoth');const r=await mammoth.convertToHtml({arrayBuffer:await file.arrayBuffer()});return {mode,text:wordText(r.value)}}
  if(/\.(doc|rtf|odt|pages)$/.test(n))throw new Error('Este Word es de formato antiguo. Ábrelo en Word y usa "Guardar como" → Documento de Word (.docx), y súbelo otra vez.');
  if(/\.(xlsx|xls|csv)$/.test(n)){await lib('xlsx');const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});return {mode,text:wb.SheetNames.map(s=>'Hoja '+s+':\n'+XLSX.utils.sheet_to_csv(wb.Sheets[s])).join('\n\n')}}

/* Importar presupuesto desde Excel */
async function importExcel(){const inp=document.createElement('input');inp.type='file';inp.accept='.xlsx,.xls,.csv';inp.onchange=async()=>{const f=inp.files[0];if(!f)return;

  const KEYS={concept:/concepto|descrip|servicio|partida|art[ií]culo|item|detalle/i,vendor:/proveedor|empresa|vendor|qui[eé]n/i,cat:/categor|rubro|[aá]rea|tipo/i,est:/estimad|presupuest|budget/i,quote:/cotiz|costo|precio|total|monto|importe|valor/i,paid:/pagad|anticipo|abono|pago/i};
  let hr=rows.findIndex(r=>r.filter(c=>Object.values(KEYS).some(k=>k.test(String(c)))).length>=2);if(hr<0)hr=0;const head=rows[hr].map(String);
  const det={};for(const [k,re] of Object.entries(KEYS)){const i=head.findIndex((h,ix)=>re.test(h)&&!Object.values(det).includes(ix));if(i>=0)det[k]=i}
  const body=rows.slice(hr+1).filter(r=>r.some(c=>String(c).trim()!==''));const num=v=>{if(typeof v==='number')return v;const n=parseFloat(String(v).replace(/[^\d.\-]/g,''));return isNaN(n)?0:n};
  const sel=(k,lbl)=>`<div class="field"><label>${lbl}</label><select data-map="${k}"><option value="">(no usar)</option>${head.map((h,i)=>`<option value="${i}" ${det[k]===i?'selected':''}>${esc(h||'Columna '+(i+1))}</option>`).join('')}</select></div>`;
  const build=()=>{const mp={};document.querySelectorAll('[data-map]').forEach(s=>mp[s.dataset.map]=s.value===''?null:+s.value);
    return body.map(r=>{const g=k=>mp[k]==null?'':r[mp[k]];const concept=String(g('concept')).trim();if(!concept||/^total|^subtotal|^gran total/i.test(concept))return null;const est=num(g('est')),quote=num(g('quote')),paid=num(g('paid'));
      const cv=String(g('cat')).trim(),cat=CATS.find(c=>cv&&(c.toLowerCase().includes(cv.toLowerCase())||cv.toLowerCase().includes(c.toLowerCase().split(' ')[0])))||guessCat(concept+' '+cv)||cv||'Otros';
      return {id:uid(),cat,concept,vendor:String(g('vendor')).trim(),est,quote,status:quote>0?'cotizado':'estimado',payments:paid>0?[{id:uid(),date:new Date().toISOString().slice(0,10),amount:paid,note:'Importado de Excel'}]:[],due:'',visible:true,note:'',doc:''}}).filter(Boolean)};

   <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" id="mX">Cancelar</button><button class="btn primary" id="mOk">Importar</button></div>`);
  const prev=()=>{const it=build();$('#impPrev').innerHTML=`<p class="note"><b>${it.length} conceptos</b> listos. Primeros:</p><div class="upc">${it.slice(0,5).map(i=>`<div><span>${esc(i.concept)}<br><small class="muted">${esc(i.cat)}${i.vendor?' · '+esc(i.vendor):''}</small></span><span class="money">${money(i.quote||i.est,V.w.currency)}</span></div>`).join('')}</div>`;$('#mOk').textContent=`Importar ${it.length} conceptos`};

function guessCat(t){t=t.toLowerCase();const G=[['Lugar',/lugar|venue|hacienda|sal[oó]n|jard[ií]n|renta/],['Alimentos y bebidas',/banquete|cena|men[uú]|comida|catering|canap|barra|bebida|licor|vino|mixolog|bar\b|alimento/],['Fotografía',/fot[oó]/],['Video',/video|film/],['Música y DJ',/dj|m[uú]sica|banda|mariachi|sax|violin/],['Flores y decoración',/flor|decora|centro de mesa|arco/],['Mobiliario y mantelería',/mobiliario|silla|mesa|mantel|loza|cristaler/],['Iluminación y audio',/ilumina|luz|audio|sonido|pista/],['Pastel y postres',/pastel|postre|candy/],['Vestido y atuendo',/vestido|traje|smoking/],['Belleza',/maquill|peinado|belleza/],['Invitaciones y papelería',/invitaci|papeler|men[uú]s impresos|letrero/],['Ceremonia',/ceremonia|oficiante|juez|iglesia|misa/],['Transporte',/transporte|camioneta|auto|shuttle/],['Hospedaje',/hotel|hospedaje|villa/],['Honorarios Memories',/coordinaci|planner|memories|honorario/]];for(const [c,re] of G)if(re.test(t))return c;return ''}

function parseHora(h){if(h==null)return null;const m=String(h).trim().toLowerCase().match(/^(\d{1,2})(?:[:.h](\d{2}))?\s*(a\.?\s?m\.?|p\.?\s?m\.?)?/);if(!m)return null;let H=+m[1],M=+(m[2]||0);const ap=(m[3]||'').replace(/[\s.]/g,'');if(ap.startsWith('p')&&H<12)H+=12;if(ap.startsWith('a')&&H===12)H=0;if(H>23||M>59)return null;return H*60+M}
function parseItin(txt){const out=[];let prev=null;for(const raw of txt.split(/\r?\n/)){const line=raw.replace(/^[\s•\-*·–—]+/,'').trim();if(!line)continue;
  const m=line.match(/^(\d{1,2})(?:[:.h](\d{2}))?\s*(a\.?\s?m\.?|p\.?\s?m\.?|hrs?\.?|h\b)?\s*(?:[-–—:|·]|a\s+\d{1,2}(?::\d{2})?\s*(?:a\.?\s?m\.?|p\.?\s?m\.?)?)?\s*(.*)$/i);
  if(!m||!/\d/.test(line.slice(0,2))||!m[4]){if(out.length)out[out.length-1].note=(out[out.length-1].note?out[out.length-1].note+' · ':'')+line;continue}
  let h=+m[1],mi=+(m[2]||0);const ap=(m[3]||'').toLowerCase().replace(/[\s.]/g,'');if(h>23||mi>59)continue;
  if(ap.startsWith('p')&&h<12)h+=12;else if(ap.startsWith('a')&&h===12)h=0;else if(!ap&&!/^0/.test(m[1])&&h<12&&h>=1&&h<=11&&(prev==null?h<=10:prev>=12*60))h+=12;
  let t=h*60+mi;if(prev!=null&&t<prev-120)t+=1440;out.push({t,title:m[4].replace(/^[-–—:|·\s]+/,'').trim(),note:''});prev=t}
  return out}
function pasteItin(){const w=V.w;modal(`<h2>Pegar itinerario</h2><p class="note">Copia el itinerario de Word, WhatsApp o un correo y pégalo aquí, o sube el archivo de Word directamente. Una línea por momento, con su hora: <i>5:00 pm Ceremonia</i>.</p>
  <textarea id="itTxt" style="min-height:180px;margin-top:10px" placeholder="4:30 pm Llegada de invitados&#10;5:00 pm Ceremonia&#10;5:45 pm Cóctel&#10;7:00 pm Cena"></textarea>
  <div class="row" style="margin-top:6px"><label class="btn sm" for="itFile" style="cursor:pointer">Leer desde Word, PDF o foto con IA</label><input type="file" id="itFile" hidden accept=".docx,.doc,.pdf,.jpg,.jpeg,.png,.webp,image/*,application/pdf"><span class="note" id="itMsg" style="margin:0"></span></div>
  <div id="itPrev"></div>
  <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" id="mX">Cancelar</button><button class="btn primary" id="mOk" disabled>Usar este itinerario</button></div>`);
  $('#mX').onclick=closeModal;const ss=sunsetMin(w);
  const prev=()=>{const it=parseItin($('#itTxt').value);const ai=it.findIndex(x=>/ceremonia|boda civil|bendici/i.test(x.title));
    $('#itPrev').innerHTML=it.length?`<p class="note"><b>${it.length} momentos</b> encontrados.</p><div class="upc" style="max-height:220px;overflow:auto">${it.map((x,i)=>`<div><span>${esc(x.title)}${x.note?`<br><small class="muted">${esc(x.note)}</small>`:''}</span><span class="money">${hm(x.t)}</span></div>`).join('')}</div>
     <fieldset style="border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:10px"><legend class="eyebrow" style="padding:0 6px">¿Cómo lo guardo?</legend>
     <label class="row" style="font-size:13px"><input type="radio" name="itm" value="sun" ${ss!=null?'checked':''} ${ss==null?'disabled':''}> Ligarlo al atardecer: si cambia la fecha, todo se recorre solo</label>
     <div class="row" style="margin:6px 0 8px 24px;font-size:13px"><span>Momento ancla:</span><select id="itA" style="width:auto">${it.map((x,i)=>`<option value="${i}" ${i===(ai<0?0:ai)?'selected':''}>${esc(x.title)}</option>`).join('')}</select></div>
     <label class="row" style="font-size:13px"><input type="radio" name="itm" value="fix" ${ss==null?'checked':''}> Dejar las horas fijas</label>${ss==null?'<p class="note">Para ligarlo al atardecer, primero pon fecha y destino en "Datos y acceso".</p>':''}</fieldset>`:'';
    $('#mOk').disabled=!it.length};
  $('#itTxt').oninput=prev;
  $('#itFile').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const msg=$('#itMsg');msg.className='note';msg.textContent=tr('Leyendo con IA…');
    try{const doc=await Store.uploadDoc(V.id,f,{kind:'otro',visible:false});V.docs.unshift(doc);const p=await aiPayload(f,doc,'itinerario');
      if(p.text&&!$('#itTxt').value.trim()){$('#itTxt').value=p.text;prev()}
      p.context=aiCtx();const r=await Store.ai(p);let t=null,last=null;const lines=[],miss=[];
      for(const m of r.data.momentos||[]){let min=parseHora(m.hora);if(min==null&&t!=null)min=t;if(min==null&&last!=null)min=last;if(min==null){miss.push(m.momento);continue}last=min;lines.push(`${hm(min)} ${String(m.momento||'').trim()}${m.notas?'\n'+m.notas:''}`);t=min+(+m.duracion_min||0)||null;if(!m.duracion_min)t=null}
      if(!lines.length)throw new Error(tr('La IA no encontró momentos con hora en ese archivo. Revisa el texto de arriba o escríbelo con su hora.'));
      $('#itTxt').value=lines.join('\n');prev();const n=parseItin($('#itTxt').value).length;
      msg.textContent=`${tr('Listo')}: ${n} ${tr('momentos.')} `+(miss.length?tr('Sin hora')+': '+miss.slice(0,3).join(', ')+'. ':'')+((r.data.dudosos||[]).length?tr('Revisa')+': '+r.data.dudosos.slice(0,3).join(', '):tr('Revisa las horas y toca "Usar este itinerario".'))}
    catch(err){msg.className='note err';msg.textContent=err.message}};
  $('#mOk').onclick=()=>{const it=parseItin($('#itTxt').value);if(!it.length)return;const mode=(document.querySelector('[name="itm"]:checked')||{}).value||'fix',a=+($('#itA')?.value||0);
    const blocks=it.map((x,i)=>({id:uid(),t:x.title,dur:Math.max(5,i<it.length-1?it[i+1].t-x.t:30),anchor:mode==='sun'&&i===a,fixed:'',couple:true,note:x.note||''}));
    if(mode==='fix'){blocks.forEach((b,i)=>{const t=((it[i].t%1440)+1440)%1440;b.fixed=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')});w.itinerary.blocks=blocks}
    else{w.itinerary.blocks=blocks;w.itinerary.lead=Math.round(ss-it[a].t);w.itinerary.round=false}
    markDirty();closeModal();tabItin($('#tab'));toast(mode==='sun'?`Listo. La ceremonia queda ${w.itinerary.lead} min antes del atardecer.`:'Itinerario cargado con horas fijas.')}}

function renderLogin(){$('#app').innerHTML=`<main class="login"><div class="row" style="justify-content:flex-end;margin-bottom:10px">${langBtn()}</div><p class="eyebrow">Weddings &amp; Events</p><h1>Memories</h1><p class="muted" style="margin:6px 0 18px">Portal de bodas</p>
  <div class="card"><div class="seg" role="group" style="margin-bottom:16px"><button data-lm="couple" aria-pressed="true">Soy novio o novia</button><button data-lm="vendor" aria-pressed="false">Proveedor</button><button data-lm="planner" aria-pressed="false">Soy la planner</button></div><div id="lf"></div></div></main>`;
  const draw=m=>{document.querySelectorAll('[data-lm]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lm===m));const f=$('#lf');
    if(m==='couple'||m==='vendor'){f.innerHTML=`<div class="field"><label for="le">Tu correo</label><input type="email" id="le" autocomplete="email" placeholder="tu@correo.com"></div><div class="field"><label for="lp">Contraseña</label><input type="password" id="lp" autocomplete="current-password"></div><button class="btn primary" id="lgo" style="width:100%;justify-content:center">${m==='vendor'?'Ver la inspiración':'Entrar a mi boda'}</button><p class="note">${m==='vendor'?'Usa el correo y la contraseña que te mandó Memories.':'Usa el correo y la contraseña que te dio tu wedding planner.'}</p>`;
      const go=async()=>{const e=$('#le').value.trim(),p=$('#lp').value;if(!e||!p)return toast('Escribe tu correo y contraseña.');try{await Store.signIn(e,p)}catch(err){toast(/invalid/i.test(err.message)?'Correo o contraseña incorrectos.':err.message)}};$('#lgo').onclick=go;$('#lp').onkeydown=ev=>{if(ev.key==='Enter')go()}}
    else{f.innerHTML=`<div class="field"><label for="le">Correo</label><input type="email" id="le" autocomplete="email"></div><div class="field"><label for="lp">Contraseña</label><input type="password" id="lp" autocomplete="current-password"></div>
      <div class="row"><button class="btn primary" id="lin">Entrar</button><button class="btn" id="lup">Crear cuenta</button></div><p class="note">La primera vez toca "Crear cuenta".</p>`;
      $('#lin').onclick=async()=>{try{await Store.signIn($('#le').value.trim(),$('#lp').value)}catch(e){toast(e.message==='Invalid login credentials'?'Correo o contraseña incorrectos.':e.message)}};
      $('#lup').onclick=async()=>{const e=$('#le').value.trim(),p=$('#lp').value;if(p.length<8)return toast('La contraseña debe tener al menos 8 caracteres.');LS.set('mw.wantPlanner',e.toLowerCase());try{const r=await Store.signUp(e,p);if(r.session){await Store.becomePlanner();route()}else{LS.set('mw.wantPlanner',e.toLowerCase());f.innerHTML=`<h3>Confirma tu correo</h3><p class="note">Te mandamos un correo a <b>${esc(e)}</b>. Ábrelo y después entra aquí con tu contraseña.</p>`}}catch(err){toast(err.message)}}}};
  document.querySelectorAll('[data-lm]').forEach(b=>b.onclick=()=>draw(b.dataset.lm));draw('couple');bindLang()}

/* ---------- Inicio ---------- */
(async()=>{$('#app').innerHTML='<p class="empty">Cargando…</p>';
  try{await Store.init()}catch(e){$('#app').innerHTML=`<div class="login"><div class="card"><h2>No se pudo conectar</h2><p class="note">${esc(e.message)}. Revisa tu conexión a internet y recarga la página.</p></div></div>`;return}
  if(!DEMO&&Store.user&&Store.role==='couple'&&LS.get('mw.wantPlanner')===Store.email()){await Store.becomePlanner().catch(()=>{});LS.set('mw.wantPlanner','')}
  if(DEMO&&!Store.demo().weddings.length)seedDemo();
  route()})();

  d.priv[id]={notes:'Ejemplo: a la novia no le gustan las rosas rojas. Confirmar menú vegetariano para 8 invitados.'};Store.demoSave(d);LS.set('mw.demoCouple',id)}
